<style>
  :root {
    --bg: #F6F1E4;
    --surface: #FBF8F0;
    --border: #E0D6BE;
    --text: #3A2E1F;
    --text-secondary: #8A7A5C;
    --text-muted: #B0A183;
    --accent: #B4713B;
    --accent-bg: #F0E0D0;
    --danger: #A83B2B;
    --radius: 6px;
    --font-serif: Georgia, "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px;
    border-bottom: none;
    background-image: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 10px);
    background-position: bottom;
    background-size: 100% 1px;
    background-repeat: no-repeat;
    padding-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-family: var(--font-serif); font-size: 20px; font-weight: 400; margin: 0; }
  .app-footer {
    padding: 8px 16px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  main { flex: 1; padding: 16px; overflow-y: auto; }
  .search-sticky {
    position: sticky;
    top: -16px;
    margin: -16px -16px 0;
    padding: 16px 16px 8px;
    background: var(--surface);
    z-index: 2;
  }

  .menu-wrap { position: relative; }
  #menu-btn {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 32px;
    height: 32px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
  }
  #menu-btn span { display: block; width: 20px; height: 2px; background: var(--text); margin: 0 auto; }
  .menu-dropdown {
    display: none;
    position: absolute;
    top: 40px;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 140px;
    padding: 6px 0;
    z-index: 5;
  }
  .menu-dropdown.open { display: block; }
  .menu-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 14px;
    border: none;
    background: none;
    font-family: var(--font-serif);
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .menu-dropdown button:hover { background: var(--bg); }
  .menu-divider { height: 1px; background: var(--border); margin: 6px 0; }

  input, textarea, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 16px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  label {
    font-size: 12px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
  }
  .field { margin-bottom: 12px; }
  .row { display: flex; gap: 10px; }
  .row > .field { flex: 1; }

  button.primary {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--surface);
    font-family: var(--font-serif);
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.85; }

  .chip-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
  .chip {
    font-family: var(--font-serif);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 0;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-secondary);
    white-space: nowrap;
    cursor: pointer;
    background: none;
  }
  .chip.active { background: none; color: var(--text); border-bottom-color: var(--accent); }

  .work-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .work-card .work-header {
    padding: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .work-header .title { font-family: var(--font-serif); font-size: 16px; font-weight: 400; margin: 0; }
  .work-header .sub { font-size: 12px; color: var(--text-secondary); margin: 3px 0 0; }
  .work-header .count { font-size: 12px; color: var(--text-muted); }
  .score-list { border-top: 1px solid var(--border); display: none; }
  .score-list.open { display: block; }
  .score-row {
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .score-row:last-child { border-bottom: none; }
  .score-row .thumb {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    object-fit: cover;
    flex-shrink: 0;
    cursor: pointer;
  }
  .score-row .pdf-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-bg);
    color: var(--accent);
    font-size: 10px;
    font-weight: 500;
  }
  .score-row .info { flex: 1; display: flex; justify-content: space-between; }
  .score-row .part { font-weight: 500; }
  .score-row .loc { color: var(--text-secondary); }
  .score-row .actions { display: flex; gap: 8px; margin-left: 8px; flex-shrink: 0; }
  .score-row .actions button {
    border: none;
    background: none;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 4px;
  }
  .score-row .actions button.delete { color: var(--danger); }

  .performance-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .performance-item:last-child { border-bottom: none; }
  .performance-item .date { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
  .performance-item button {
    border: none;
    background: none;
    color: var(--danger);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
  }

  .concert-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .concert-row:last-child { border-bottom: none; }
  .concert-row .date { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
  .concert-row .count { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
  .concert-row .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .concert-row .actions button {
    border: none;
    background: none;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 4px;
  }
  .concert-row .actions button.delete { color: var(--danger); }
  .concert-row.editing { flex-direction: column; align-items: stretch; gap: 8px; }
  .concert-row.editing .edit-fields { display: flex; gap: 6px; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-overlay img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 8px;
  }

  .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 40px 0; }

  .photo-input {
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 16px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .photo-input img { max-width: 100%; max-height: 140px; border-radius: 8px; }
  .photo-input input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }

  .hint {
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    border-radius: var(--radius);
    padding: 6px 8px;
    margin-top: 6px;
  }
  .error { font-size: 12px; color: var(--danger); margin-top: 4px; }
  .view { display: none; }
  .view.active { display: block; }

  .autocomplete-wrap { position: relative; }
  .autocomplete-list {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    max-height: 180px;
    overflow-y: auto;
    z-index: 6;
  }
  .autocomplete-list.open { display: block; }
  .autocomplete-list div {
    padding: 9px 10px;
    font-size: 14px;
    color: var(--text);
    cursor: pointer;
  }
  .autocomplete-list div:active { background: var(--bg); }
</style>
</head>

<script>
// ---- Supabase接続 ----
const sb = window.supabase.createClient(

// ---- データ層（Supabaseのworks・scoresテーブルを利用） ----
let db = { works: [], scores: [], performances: [], concerts: [], composers: [], parts: [] };

async function loadData() {
  const { data: works, error: worksError } = await sb.from('works').select('*').order('created_at');
  const { data: scores, error: scoresError } = await sb.from('scores').select('*').order('created_at');
  const { data: concerts, error: concertsError } = await sb.from('concerts').select('*').order('concert_date', { ascending: false });
  const { data: performances, error: performancesError } = await sb.from('performances').select('*').order('created_at', { ascending: false });
  const { data: composers, error: composersError } = await sb.from('composers').select('*').order('name');
  const { data: parts, error: partsError } = await sb.from('parts').select('*').order('name');
  if (worksError || scoresError || concertsError || performancesError || composersError || partsError) {
    console.error(worksError, scoresError, concertsError, performancesError, composersError, partsError);
    resultsEl.innerHTML = '<div class="empty">データの取得に失敗しました</div>';
    return;
  }
  db.works = works;
  db.scores = scores;
  db.concerts = concerts;
  db.performances = performances;
  db.composers = composers;
  db.parts = parts;
}

function findWorkByTitle(title) {
  const norm = title.trim();
  if (!norm) return null;
  return db.works.find(w => w.title.trim() === norm) || null;
}

// ---- 名前だけを持つマスタ（作曲家・パート）の共通処理 ----
function makeSimpleMaster(table) {
  return {
    table,
    byId(id) {
      return db[table].find(x => x.id === id) || null;
    },
    findByName(name) {
      const norm = (name || '').trim();
      if (!norm) return null;
      return db[table].find(x => x.name.trim() === norm) || null;
    },
    async addOrGet(name) {
      const existing = this.findByName(name);
      if (existing) return existing;
      const { data, error } = await sb.from(table).insert({ name: name.trim() }).select().single();
      if (error) { alert('保存に失敗しました：' + error.message); throw error; }
      db[table].push(data);
      return data;
    },
    async update(id, name) {
      const { error } = await sb.from(table).update({ name: name.trim() }).eq('id', id);
      if (error) { alert('更新に失敗しました：' + error.message); return; }
      const item = this.byId(id);
      if (item) item.name = name.trim();
    },
    async remove(id) {
      const { error } = await sb.from(table).delete().eq('id', id);
      if (error) { alert('削除に失敗しました：' + error.message); return; }
      db[table] = db[table].filter(x => x.id !== id);
    },
  };
}
const composerMaster = makeSimpleMaster('composers');
const partMaster = makeSimpleMaster('parts');

async function addOrGetWork({ title, composer }) {
  const existing = findWorkByTitle(title);
  if (existing) return existing;
  const composerRow = await composerMaster.addOrGet(composer);
  const { data, error } = await sb.from('works').insert({
    title: title.trim(),
    composer_id: composerRow.id,
  }).select().single();
  if (error) { alert('楽曲の保存に失敗しました：' + error.message); throw error; }
  db.works.push(data);
  return data;
}

async function addScore({ workId, partName, memo, imagePath }) {
  const partRow = await partMaster.addOrGet(partName);
  const { data, error } = await sb.from('scores').insert({
    work_id: workId,
    part_id: partRow.id,
    memo: memo.trim(),
    image_path: imagePath || null,
  }).select().single();
  if (error) { alert('楽譜の保存に失敗しました：' + error.message); throw error; }
  db.scores.push(data);
  return data;
}

function scoresForWork(workId) {
  return db.scores.filter(s => s.work_id === workId);
}

function performancesForScore(scoreId) {
  return db.performances.filter(p => p.score_id === scoreId);
}

function concertById(concertId) {
  return db.concerts.find(c => c.id === concertId) || null;
}

function latestConcertNameForScore(scoreId) {
  const concerts = performancesForScore(scoreId)
    .map(p => concertById(p.concert_id))
    .filter(Boolean);
  if (concerts.length === 0) return null;
  const dated = concerts.filter(c => c.concert_date).sort((a, b) => b.concert_date.localeCompare(a.concert_date));
  return (dated[0] || concerts[0]).name;
}

function findConcertByName(name) {
  const norm = name.trim();
  if (!norm) return null;
  return db.concerts.find(c => c.name.trim() === norm) || null;
}

async function addOrGetConcert({ name, date }) {
  const existing = findConcertByName(name);
  if (existing) return existing;
  const { data, error } = await sb.from('concerts').insert({
    name: name.trim(),
    concert_date: date || null,
  }).select().single();
  if (error) { alert('演奏会の保存に失敗しました：' + error.message); throw error; }
  db.concerts.push(data);
  return data;
}

async function addPerformance({ scoreId, concertName, concertDate }) {
  const concert = await addOrGetConcert({ name: concertName, date: concertDate });
  const { data, error } = await sb.from('performances').insert({
    score_id: scoreId,
    concert_id: concert.id,
  }).select().single();
  if (error) { alert('演奏会の紐付けに失敗しました：' + error.message); throw error; }
  db.performances.push(data);
  return data;
}

async function deletePerformance(performanceId) {
  const { error } = await sb.from('performances').delete().eq('id', performanceId);
  if (error) { alert('演奏会の削除に失敗しました：' + error.message); return; }
  db.performances = db.performances.filter(p => p.id !== performanceId);
}

async function updateConcert(concertId, { name, date }) {
  const payload = { name: name.trim(), concert_date: date || null };
  const { error } = await sb.from('concerts').update(payload).eq('id', concertId);
  if (error) { alert('演奏会の更新に失敗しました：' + error.message); return; }
  const concert = db.concerts.find(c => c.id === concertId);
  if (concert) Object.assign(concert, payload);
}

async function deleteConcert(concertId) {
  const { error } = await sb.from('concerts').delete().eq('id', concertId);
  if (error) { alert('演奏会の削除に失敗しました：' + error.message); return; }
  db.concerts = db.concerts.filter(c => c.id !== concertId);
  db.performances = db.performances.filter(p => p.concert_id !== concertId);
}

function performanceCountForConcert(concertId) {
  return db.performances.filter(p => p.concert_id === concertId).length;
}

async function deleteScore(scoreId) {
  const score = db.scores.find(s => s.id === scoreId);
  if (!score) return;
  const { error } = await sb.from('scores').delete().eq('id', scoreId);
  if (error) { alert('削除に失敗しました：' + error.message); return; }
  db.scores = db.scores.filter(s => s.id !== scoreId);
  db.performances = db.performances.filter(p => p.score_id !== scoreId);
  if (scoresForWork(score.work_id).length === 0) {
    await sb.from('works').delete().eq('id', score.work_id);
    db.works = db.works.filter(w => w.id !== score.work_id);
  }
  renderResults();
}

async function updateWorkFields(workId, { title, composer }) {

async function updateScore(scoreId, { partName, memo, imagePath }) {

async function uploadFile(file) {
  const ext = file.name.includes('.') ? file.name.split('.').pop() : 'dat';
  const path = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

  return data.publicUrl;

function renderMasterCardList() {
  let items, countFn, subFn;
  if (activeFilter === '演奏会') {
    items = db.concerts;
    countFn = performanceCountForConcert;
    subFn = c => c.concert_date;
  } else if (activeFilter === '作曲家') {
    items = db.composers;
    countFn = id => db.works.filter(w => w.composer_id === id).length;
    subFn = () => null;
  } else {
    items = db.parts;
    countFn = id => db.scores.filter(s => s.part_id === id).length;
    subFn = () => null;
  }

  const query = searchInput.value.trim().toLowerCase();
  if (query) {
    items = items.filter(item => item.name.toLowerCase().includes(query));
  }

  if (items.length === 0) {
    resultsEl.innerHTML = '<div class="empty">該当するデータがありません</div>';
    return;
  }

  const sorted = [...items].sort((a, b) => a.name.localeCompare(b.name, 'ja'));

    const card = document.createElement('div');
    card.className = 'work-card';
    const header = document.createElement('div');
    header.className = 'work-header';
    header.style.cursor = 'pointer';
    header.innerHTML = `
      <div>
        <p class="title">${escapeHtml(item.name)}</p>
        ${subFn(item) ? `<p class="sub">${escapeHtml(subFn(item))}</p>` : ''}
      </div>
      <span class="count">${countFn(item.id)}件</span>

    header.addEventListener('click', () => {
      drillDown = { type: activeFilter, id: item.id };
      renderResults();
    });
    card.appendChild(header);
    resultsEl.appendChild(card);
  });

function renderDrillDownList() {
  renderBackButton(() => { drillDown = null; renderResults(); });

  let filterFn;
  if (drillDown.type === '演奏会') {
    filterFn = (work, scores) => scores.some(s => performancesForScore(s.id).some(p => p.concert_id === drillDown.id));
  } else if (drillDown.type === '作曲家') {
    filterFn = (work) => work.composer_id === drillDown.id;
  } else {
    filterFn = (work, scores) => scores.some(s => s.part_id === drillDown.id);
  }

  const filtered = db.works
    .map(w => ({ work: w, scores: scoresForWork(w.id) }))
    .filter(({ work, scores }) => filterFn(work, scores));

  if (filtered.length === 0) {
    resultsEl.innerHTML += '<div class="empty">該当する楽譜がありません</div>';
    return;
  }
  appendWorkCards(filtered);
}

function renderResults() {
  const query = searchInput.value.trim();
  resultsEl.innerHTML = '';

  if (activeFilter === '演奏会' || activeFilter === '作曲家' || activeFilter === 'パート') {
    if (drillDown && drillDown.type === activeFilter) {
      renderDrillDownList();
    } else {
      renderMasterCardList();
    }
    return;
  }

  const filtered = db.works
    .map(w => ({ work: w, scores: scoresForWork(w.id) }))
    .filter(({ work, scores }) => matches(work, scores, query));

  if (filtered.length === 0) {
    resultsEl.innerHTML = '<div class="empty">登録された楽譜がありません</div>';
    return;
  }
  appendWorkCards(filtered);
}

// ---- 自前オートコンプリート（iOS Safariはdatalistの候補をほぼ表示できないため） ----
function setupAutocomplete(inputEl, listEl, getOptions) {
  function render() {
    const q = inputEl.value.trim().toLowerCase();
    const options = getOptions();
    const matched = (q ? options.filter(name => name.toLowerCase().includes(q)) : options).slice(0, 8);
    if (matched.length === 0) {
      listEl.classList.remove('open');
      listEl.innerHTML = '';
      return;
    }
    listEl.innerHTML = matched.map(name => `<div>${escapeHtml(name)}</div>`).join('');
    listEl.classList.add('open');
  }
  inputEl.addEventListener('focus', render);
  inputEl.addEventListener('input', render);
  inputEl.addEventListener('blur', () => setTimeout(() => listEl.classList.remove('open'), 150));
  listEl.addEventListener('mousedown', (e) => {
    if (e.target.tagName !== 'DIV') return;
    inputEl.value = e.target.textContent;
    listEl.classList.remove('open');
    inputEl.dispatchEvent(new Event('input', { bubbles: true }));
  });
}
setupAutocomplete(fComposer, document.getElementById('composer-suggest'), () => db.composers.map(c => c.name));
setupAutocomplete(fPart, document.getElementById('part-suggest'), () => db.parts.map(p => p.name));

  performances.forEach(p => {
    const concert = concertById(p.concert_id);
    const item = document.createElement('div');
    item.className = 'performance-item';
    item.innerHTML = `
      <span>${escapeHtml(concert?.name || '(不明な演奏会)')}${concert?.concert_date ? `<span class="date">${escapeHtml(concert.concert_date)}</span>` : ''}</span>
      <button type="button">削除</button>
    `;
    item.querySelector('button').addEventListener('click', async () => {
      await deletePerformance(p.id);
      renderPerformanceList(scoreId);
      renderResults();
    });
    performanceListEl.appendChild(item);
  });
}

document.getElementById('performance-add-btn').addEventListener('click', async () => {
  if (!editingScoreId) return;
  const name = performanceNameInput.value.trim();
  if (!name) { performanceNameInput.focus(); return; }
  await addPerformance({
    scoreId: editingScoreId,
    concertName: name,
    concertDate: performanceDateInput.value,
  });
  performanceNameInput.value = '';
  performanceDateInput.value = '';
  renderPerformanceList(editingScoreId);
  renderConcertOptions();
  renderResults();
});

function renderConcertOptions() {
  // 演奏会名の候補は自前のオートコンプリートがdb.concertsを直接参照するため、ここでは何もしない
}

// ---- 演奏会マスタ管理画面 ----
const concertMasterListEl = document.getElementById('concert-master-list');
const concertNewNameInput = document.getElementById('concert-new-name');
const concertNewDateInput = document.getElementById('concert-new-date');

function renderConcertMasterList() {
  concertMasterListEl.innerHTML = '';
  if (db.concerts.length === 0) {
    concertMasterListEl.innerHTML = '<div class="empty">登録された演奏会がありません</div>';
    return;
  }
  const sorted = [...db.concerts].sort((a, b) => (b.concert_date || '').localeCompare(a.concert_date || ''));
  sorted.forEach(c => {
    const row = document.createElement('div');
    row.className = 'concert-row';
    row.innerHTML = `
      <span>${escapeHtml(c.name)}${c.concert_date ? `<span class="date">${escapeHtml(c.concert_date)}</span>` : ''}<span class="count">・ ${performanceCountForConcert(c.id)}件で使用中</span></span>
      <div class="actions">
        <button type="button" class="edit">編集</button>
        <button type="button" class="delete">削除</button>
      </div>
    `;
    row.querySelector('.edit').addEventListener('click', () => startEditConcert(c.id));
    row.querySelector('.delete').addEventListener('click', () => {
      const count = performanceCountForConcert(c.id);
      const msg = count > 0
        ? `この演奏会は${count}件の楽譜に紐付いています。削除するとその紐付けも消えます。削除しますか？`
        : 'この演奏会を削除しますか？';
      if (confirm(msg)) {
        deleteConcert(c.id).then(() => {
          renderConcertMasterList();
          renderConcertOptions();
          renderResults();
        });
      }
    });
    concertMasterListEl.appendChild(row);
  });
}

function startEditConcert(concertId) {
  const concert = db.concerts.find(c => c.id === concertId);
  if (!concert) return;
  // 該当行を編集フォームに差し替え
  const target = [...concertMasterListEl.children][db.concerts
    .slice()
    .sort((a, b) => (b.concert_date || '').localeCompare(a.concert_date || ''))
    .findIndex(c => c.id === concertId)];
  target.className = 'concert-row editing';
  target.innerHTML = `
    <div class="edit-fields">
      <input type="text" value="${escapeHtml(concert.name)}" style="flex:2;">
      <input type="date" value="${concert.concert_date || ''}" style="flex:1;">
    </div>
    <div class="actions" style="justify-content:flex-end;">
      <button type="button" class="save">保存</button>
      <button type="button" class="cancel">キャンセル</button>
    </div>
  `;
  const [nameInput, dateInput] = target.querySelectorAll('input');
  target.querySelector('.save').addEventListener('click', async () => {
    if (!nameInput.value.trim()) { nameInput.focus(); return; }
    await updateConcert(concertId, { name: nameInput.value, date: dateInput.value });
    renderConcertMasterList();
    renderConcertOptions();
    renderResults();
  });
  target.querySelector('.cancel').addEventListener('click', renderConcertMasterList);
}

document.getElementById('concert-new-add-btn').addEventListener('click', async () => {
  const name = concertNewNameInput.value.trim();
  if (!name) { concertNewNameInput.focus(); return; }
  await addOrGetConcert({ name, date: concertNewDateInput.value });
  concertNewNameInput.value = '';
  concertNewDateInput.value = '';
  renderConcertMasterList();
  renderConcertOptions();
});

// ---- 作曲家・パートの候補更新 ----
function renderSimpleMasterOptions(datalistId, table) {
  const datalist = document.getElementById(datalistId);
  if (datalist) datalist.innerHTML = db[table].map(x => `<option value="${escapeHtml(x.name)}">`).join('');
}
function renderComposerOptions() {
  renderSimpleMasterOptions('composer-options', 'composers');
}
function renderPartOptions() {
  renderSimpleMasterOptions('part-options', 'parts');
}

// ---- 作曲家・パートのマスタ管理画面（共通処理） ----
function renderSimpleMasterList(containerEl, table, master, countFn, refreshOptionsFn) {
  containerEl.innerHTML = '';
  if (db[table].length === 0) {
    containerEl.innerHTML = '<div class="empty">登録されたデータがありません</div>';
    return;
  }
  const sorted = [...db[table]].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  sorted.forEach(item => {
    const row = document.createElement('div');
    row.className = 'concert-row';
    row.innerHTML = `
      <span>${escapeHtml(item.name)}<span class="count">・ ${countFn(item.id)}件で使用中</span></span>
      <div class="actions">
        <button type="button" class="edit">編集</button>
        <button type="button" class="delete">削除</button>
      </div>
    `;
    row.querySelector('.edit').addEventListener('click', () => {
      row.className = 'concert-row editing';
      row.innerHTML = `
        <div class="edit-fields">
          <input type="text" value="${escapeHtml(item.name)}" style="flex:1;">
        </div>
        <div class="actions" style="justify-content:flex-end;">
          <button type="button" class="save">保存</button>
          <button type="button" class="cancel">キャンセル</button>
        </div>
      `;
      const nameInput = row.querySelector('input');
      row.querySelector('.save').addEventListener('click', async () => {
        if (!nameInput.value.trim()) { nameInput.focus(); return; }
        await master.update(item.id, nameInput.value);
        renderSimpleMasterList(containerEl, table, master, countFn, refreshOptionsFn);
        refreshOptionsFn();
        renderResults();
      });
      row.querySelector('.cancel').addEventListener('click', () => renderSimpleMasterList(containerEl, table, master, countFn, refreshOptionsFn));
    });
    row.querySelector('.delete').addEventListener('click', () => {
      const count = countFn(item.id);
      const msg = count > 0
        ? `このデータは${count}件で使用されています。削除すると紐付けが解除されます（登録済みの楽譜・楽曲自体は削除されません）。削除しますか？`
        : '削除しますか？';
      if (confirm(msg)) {
        master.remove(item.id).then(() => {
          if (table === 'composers') db.works.forEach(w => { if (w.composer_id === item.id) w.composer_id = null; });
          if (table === 'parts') db.scores.forEach(s => { if (s.part_id === item.id) s.part_id = null; });
          renderSimpleMasterList(containerEl, table, master, countFn, refreshOptionsFn);
          refreshOptionsFn();
          renderResults();
        });
      }
    });
    containerEl.appendChild(row);
  });
}

const composerMasterListEl = document.getElementById('composer-master-list');
const composerNewNameInput = document.getElementById('composer-new-name');
function renderComposerMasterList() {
  renderSimpleMasterList(composerMasterListEl, 'composers', composerMaster,
    id => db.works.filter(w => w.composer_id === id).length, renderComposerOptions);
}
document.getElementById('composer-new-add-btn').addEventListener('click', async () => {
  const name = composerNewNameInput.value.trim();
  if (!name) { composerNewNameInput.focus(); return; }
  await composerMaster.addOrGet(name);
  composerNewNameInput.value = '';
  renderComposerMasterList();
  renderComposerOptions();
});

const partMasterListEl = document.getElementById('part-master-list');
const partNewNameInput = document.getElementById('part-new-name');
function renderPartMasterList() {
  renderSimpleMasterList(partMasterListEl, 'parts', partMaster,
    id => db.scores.filter(s => s.part_id === id).length, renderPartOptions);
}
document.getElementById('part-new-add-btn').addEventListener('click', async () => {
  const name = partNewNameInput.value.trim();
  if (!name) { partNewNameInput.focus(); return; }
  await partMaster.addOrGet(name);
  partNewNameInput.value = '';
  renderPartMasterList();
  renderPartOptions();
});

function startEditScore(scoreId) {
  const score = db.scores.find(s => s.id === scoreId);
  if (!score) return;
  const work = db.works.find(w => w.id === score.work_id);
  editingScoreId = scoreId;

  fTitle.value = work.title;
  fComposer.value = composerMaster.byId(work.composer_id)?.name || '';
  fPart.value = partMaster.byId(score.part_id)?.name || '';
  fMemo.value = score.memo || '';
  fComposer.disabled = false;
  matchHint.style.display = 'none';

  if (score.image_path) {
    if (isPdf(score.image_path)) {
      photoPreview.style.display = 'none';
      photoPlaceholder.style.display = 'block';
      photoPlaceholder.textContent = '登録済みのPDFがあります（変更する場合のみ選び直してください）';
    } else {
      photoPreview.src = score.image_path;
      photoPreview.style.display = 'block';
      photoPlaceholder.style.display = 'none';
    }
    existingImagePath = score.image_path;
  } else {
    photoPreview.style.display = 'none';
    photoPlaceholder.style.display = 'block';
    photoPlaceholder.textContent = '写真を撮影 / アップロード';
    existingImagePath = null;
  }
  selectedFile = null;

  performanceSection.style.display = 'block';
  renderPerformanceList(scoreId);

  saveBtn.textContent = '更新';
  showView('register');
}

fTitle.addEventListener('input', () => {
  if (editingScoreId) return;
  const existing = findWorkByTitle(fTitle.value);
  if (existing) {
    matchHint.style.display = 'block';
    matchHint.textContent = `既存の楽曲「${existing.title} / ${composerMaster.byId(existing.composer_id)?.name || '作曲家未設定'}」に追加します`;
    fComposer.value = composerMaster.byId(existing.composer_id)?.name || '';
    fComposer.disabled = true;
  } else {
    matchHint.style.display = 'none';
    fComposer.disabled = false;
  }
});

// 写真アップロード
const photoFile = document.getElementById('photo-file');
const photoPreview = document.getElementById('photo-preview');
const photoPlaceholder = document.getElementById('photo-placeholder');
let selectedFile = null;
let existingImagePath = null;

function isPdf(url) {
  return /\.pdf(\?|$)/i.test(url || '');
}

photoFile.addEventListener('change', () => {
  const file = photoFile.files[0];
  if (!file) return;
  selectedFile = file;
  if (file.type === 'application/pdf') {
    photoPreview.style.display = 'none';
    photoPlaceholder.style.display = 'block';
    photoPlaceholder.textContent = 'PDFを選択しました：' + file.name;
  } else {
    photoPreview.src = URL.createObjectURL(file);
    photoPreview.style.display = 'block';
    photoPlaceholder.style.display = 'none';
  }
});

function resetForm() {
  fTitle.value = '';
  fComposer.value = '';
  fPart.value = '';
  fMemo.value = '';
  fComposer.disabled = false;
  matchHint.style.display = 'none';
  photoPreview.style.display = 'none';
  photoPlaceholder.style.display = 'block';
  photoPlaceholder.textContent = '写真を撮影 / アップロード';
  selectedFile = null;
  existingImagePath = null;
  photoFile.value = '';
  partError.style.display = 'none';
  titleError.style.display = 'none';
  editingScoreId = null;
  saveBtn.textContent = '保存';
  performanceSection.style.display = 'none';
  performanceNameInput.value = '';
  performanceDateInput.value = '';
}

document.getElementById('save-btn').addEventListener('click', async () => {
  let valid = true;
  if (!fPart.value.trim()) { partError.style.display = 'block'; valid = false; }
  else { partError.style.display = 'none'; }
  if (!fTitle.value.trim()) {
    titleError.style.display = 'block';
    fTitle.focus();
    valid = false;
  } else {
    titleError.style.display = 'none';
  }
  if (!valid) return;

  saveBtn.disabled = true;
  saveBtn.textContent = '保存中…';
  try {
    let imagePath = existingImagePath;
    if (selectedFile) {
      imagePath = await uploadFile(selectedFile);
    }

    if (editingScoreId) {
      const score = db.scores.find(s => s.id === editingScoreId);
      await updateWorkFields(score.work_id, {
        title: fTitle.value,
        composer: fComposer.value,
      });
      await updateScore(editingScoreId, {
        partName: fPart.value,
        memo: fMemo.value,
        imagePath,
      });
    } else {
      const work = await addOrGetWork({
        title: fTitle.value,
        composer: fComposer.value,
      });
      await addScore({
        workId: work.id,
        partName: fPart.value,
        memo: fMemo.value,
        imagePath,
      });
    }
    renderComposerOptions();
    renderPartOptions();
    resetForm();
    showView('search');
  } finally {
    saveBtn.disabled = false;
  }
});

// ---- 認証 ----
const viewLogin = document.getElementById('view-login');
const appContent = document.getElementById('app-content');
const loginEmail = document.getElementById('login-email');
const loginPassword = document.getElementById('login-password');
const loginError = document.getElementById('login-error');
const loginBtn = document.getElementById('login-btn');
const logoutBtn = document.getElementById('logout-btn');

async function enterApp() {
  viewLogin.classList.remove('active');
  appContent.style.display = '';
  resultsEl.innerHTML = '<div class="empty">読み込み中…</div>';
  await loadData();
  renderConcertOptions();
  renderComposerOptions();
  renderPartOptions();
  renderResults();
}

function showLogin() {
  appContent.style.display = 'none';
  viewLogin.classList.add('active');
  loginEmail.value = '';
  loginPassword.value = '';
  loginError.style.display = 'none';
}

loginBtn.addEventListener('click', async () => {
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if (!email || !password) {
    loginError.textContent = 'メールアドレスとパスワードを入力してください';
    loginError.style.display = 'block';
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = 'ログイン中…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = 'ログイン';
  if (error) {
    loginError.textContent = 'ログインに失敗しました：' + error.message;
    loginError.style.display = 'block';
  }
});

logoutBtn.addEventListener('click', async () => {
  await sb.auth.signOut();
});

sb.auth.onAuthStateChange((event, session) => {
  if (session) {
    enterApp();
  } else {
    showLogin();
  }
});

// 初期表示（セッションの有無はonAuthStateChangeが初回発火時にも判定する）
</script>
